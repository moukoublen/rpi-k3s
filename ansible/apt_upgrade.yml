---
- name: Update Packages
  hosts: all
  serial: 1
  become: true
  become_user: root
  become_method: ansible.builtin.sudo

  tasks:
    - name: Update apt repo and cache
      ansible.builtin.apt:
        update_cache: true
        force_apt_get: true
        cache_valid_time: 120

    - name: Preview packages to be upgraded or installed
      ansible.builtin.command:
        argv:
          - apt-get
          - --simulate
          - -o
          - Debug::NoLocking=true
          - dist-upgrade
      register: apt_upgrade_preview
      changed_when: false

    - name: Extract packages from upgrade preview
      ansible.builtin.set_fact:
        apt_packages_to_change: >-
          {{ apt_upgrade_preview.stdout
             | regex_findall('^Inst\\s+([^\\s]+)', multiline=true) }}

    - name: Display packages to be upgraded or installed
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} packages to be upgraded or installed:
          {{ apt_packages_to_change | join(', ')
             if apt_packages_to_change else 'none' }}

    - name: Perform dist-upgrade
      ansible.builtin.apt:
        upgrade: dist
        force_apt_get: true

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot host when required
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after apt upgrade"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when: reboot_required.stat.exists
