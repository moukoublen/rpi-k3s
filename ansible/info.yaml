---
- name: Debug as root
  hosts: all
  become: true
  become_user: root
  become_method: ansible.builtin.sudo
  tasks:
    - name: Facts ansible_facts as root
      ansible.builtin.debug:
        var: ansible_facts
    - name: Hostvars as root
      ansible.builtin.debug:
        var: hostvars

- name: Debug as user
  hosts: all
  become: false
  tasks:
    - name: Hostvars as user
      ansible.builtin.debug:
        var: hostvars
    - name: Groups
      ansible.builtin.debug:
        var: groups
