# ansible-inventory -i inventory.yaml -y --list
# https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html
# https://docs.ansible.com/ansible-core/2.18/reference_appendices/interpreter_discovery.html

# virtual ip   192.168.178.200
# pencilvester 192.168.178.231

all:
  hosts:
    pi51:
      ansible_host: 192.168.178.232

    pi41:
      ansible_host: 192.168.178.233

    pi42:
      ansible_host: 192.168.178.234
      keepalived_priority: 120

    pi43:
      ansible_host: 192.168.178.235
      keepalived_priority: 130

    pi44:
      ansible_host: 192.168.178.236
      keepalived_priority: 140

  children:
    pies4:
      hosts:
        pi41: {}
        pi42: {}
        pi43: {}
        pi44: {}

    virtual_ip_group:
      hosts:
        pi42: {}
        pi43: {}
        pi44: {}

  vars:
    ansible_user: admin
    ansible_connection: ssh
    ansible_python_interpreter: /usr/bin/python3
    ansible_private_key_file: "~/.ssh/home_admin"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
    ntp_server: "pool.ntp.org"
    keepalived_interface: eth0
    keepalived_virtual_ip: 192.168.178.200
    keepalived_prefix_length: 24
