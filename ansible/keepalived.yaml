# journalctl -u keepalived -f

# sudo killall -USR1 keepalived   # dumps stats -> /tmp/keepalived.stats
# sudo killall -USR2 keepalived   # dumps data (config+VRRP state) -> /tmp/keepalived.data
# cat /tmp/keepalived.data
# cat /tmp/keepalived.stats

# sudo killall -SIGJSON keepalived   # -> /tmp/keepalived.json
# cat /tmp/keepalived.json

---
- name: Configure Keepalived virtual IP
  hosts: pies
  become: true
  become_user: root
  become_method: ansible.builtin.sudo

  vars:
    keepalived_virtual_router_id: 42
    keepalived_vrrp_type: multicast

  tasks:
    - name: Install Keepalived
      ansible.builtin.apt:
        name: keepalived
        state: present

    - name: Create Keepalived configuration
      ansible.builtin.template:
        src: files/keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: "0644"
        validate: "keepalived --config-test --use-file=%s"
      notify: Restart Keepalived

    - name: Enable and start Keepalived
      ansible.builtin.systemd:
        name: keepalived
        enabled: true
        state: started

  handlers:
    - name: Restart Keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: restarted
